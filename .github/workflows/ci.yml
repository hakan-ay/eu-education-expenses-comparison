name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Data model and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Rebuilds core + marts from the committed staging snapshot and runs the 12 SQL data
      # tests; exits non-zero if any test returns rows.
      - run: python -m pipeline.build --from-snapshot
      # The committed JSON must be exactly what the SQL produces (meta.json holds a timestamp).
      - name: Exported JSON is up to date
        run: git diff --exit-code -- web/public/data ':(exclude)web/public/data/meta.json'

  web:
    name: Dashboard build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint -- --deny-warnings
      - run: npm --prefix web run build
